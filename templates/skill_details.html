<!-- templates/skill_details.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{ skill.name }} — Skill</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --primary: #4fb6b2;
      --secondary: #9b8cff;
      --bg-light: #f8fafc;
      --text-dark: #2d2f34;
    }
  </style>
</head>
<body class="bg-[var(--bg-light)] text-[var(--text-dark)] font-sans min-h-screen">
  <nav class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-10">
    <div class="max-w-4xl mx-auto flex justify-between items-center py-4 px-6">
      <h1 class="text-xl font-semibold text-[var(--primary)]">My Journal</h1>
      <div class="space-x-6">
        <a href="{{ url_for('home') }}" class="text-[var(--text-dark)] hover:text-[var(--primary)] font-medium">Home</a>
        <a href="{{ url_for('analytics') }}" class="text-[var(--text-dark)] hover:text-[var(--primary)] font-medium">Analytics</a>
        <a href="{{ url_for('skills') }}" class="text-[var(--text-dark)] hover:text-[var(--primary)] font-medium">Skills</a>
      </div>
    </div>
  </nav>

  <main class="max-w-3xl mx-auto px-4 py-10">
    <h1 class="text-4xl font-bold text-center mb-2 text-[var(--secondary)]">{{ skill.name }}</h1>
    <p class="text-center text-gray-500 font-medium mb-6">{{ skill.category }}</p>

    <div class="flex justify-center gap-2 mb-6">
      {% for t in skill.tags %}
        <span class="px-3 py-1 rounded-full bg-[var(--secondary)]/10 text-[var(--secondary)] text-sm">{{ t }}</span>
      {% endfor %}
    </div>

    <div class="bg-white rounded-2xl shadow-md p-6 mb-6">
      <h2 class="text-2xl font-semibold text-[var(--primary)] mb-2">Definition</h2>
      <p class="text-gray-700">{{ skill.definition }}</p>
    </div>

    <div class="bg-white rounded-2xl shadow-md p-6 mb-6">
      <h2 class="text-2xl font-semibold text-[var(--primary)] mb-2">How to Use</h2>
      <ul class="list-disc pl-5 text-gray-700 space-y-1">
        {% for s in skill.how_to %}
          <li>{{ s }}</li>
        {% endfor %}
      </ul>
    </div>

    <div class="bg-white rounded-2xl shadow-md p-6 mb-6">
      <h2 class="text-2xl font-semibold text-[var(--primary)] mb-2">Example</h2>
      <p class="text-gray-700">{{ skill.example }}</p>
    </div>

    <div class="text-center mt-6">
      <a href="{{ url_for('skills') }}" class="text-[var(--primary)] hover:text-[var(--secondary)] font-medium">← Back to All Skills</a>
    </div>
  </main>
</body>
</html>
