<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <title>New Entry</title> <script src="https://cdn.tailwindcss.com"></script> <style> :root { --primary: #4fb6b2; --secondary: #9b8cff; --bg-light: #f8fafc; --text-dark: #2d2f34; } </style> </head> <body class="bg-[var(--bg-light)] text-[var(--text-dark)] font-sans min-h-screen"> <!-- Navbar --> <nav class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-10"> <div class="max-w-5xl mx-auto flex justify-between items-center py-4 px-6"> <h1 class="text-xl font-semibold text-[var(--primary)]">My Journal</h1> <div class="space-x-6"> <a href="{{ url_for('home') }}" class="text-[var(--text-dark)] hover:text-[var(--primary)] font-medium">Home</a> <a href="{{ url_for('analytics') }}" class="text-[var(--text-dark)] hover:text-[var(--primary)] font-medium">Analytics</a> </div> </div> </nav> <!-- Main Content --> <main class="max-w-3xl mx-auto px-6 py-10"> <h2 class="text-3xl font-bold mb-8 text-center text-[var(--secondary)]">New Journal Entry</h2>
<form method="POST" action="{{ url_for('new_entry') }}" class="space-y-8 bg-white rounded-2xl shadow-md p-8">
  <!-- Title -->
  <div>
    <label for="title" class="font-semibold block mb-2">Title</label>
    <input id="title" name="title" type="text" placeholder="Give this entry a title (optional)"
           class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-[var(--primary)] outline-none">
  </div>

  <!-- Journal Type -->
  <div>
    <label for="journal_type" class="font-semibold block mb-2">Journal Type</label>
    <select id="journal_type" name="journal_type" onchange="showSection()" required
            class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-[var(--primary)] outline-none">
      <option value="">-- Select a Journal Type --</option>
      <option value="Free Write">Free Write</option>
      <option value="Daily Journal - Morning">Daily Journal - Morning</option>
      <option value="Daily Journal - Night">Daily Journal - Night</option>
      <option value="Situational Journal">Situational Journal</option>
    </select>
  </div>

  <!-- Free Write -->
  <div id="free_write" class="hidden space-y-4">
    <h3 class="text-xl font-semibold text-[var(--primary)]">Free Write</h3>
    <textarea name="content" placeholder="Write your thoughts here..."
              class="w-full border border-gray-300 rounded-lg p-3 min-h-[120px] focus:ring-2 focus:ring-[var(--primary)] outline-none"></textarea>
  </div>

  <!-- Morning Journal -->
  <div id="morning" class="hidden space-y-4">
    <h3 class="text-xl font-semibold text-[var(--primary)]">🌅 Morning Reflections</h3>

    <label class="font-semibold">Sleep Quality</label>
    <input type="text" name="sleep_quality" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-[var(--primary)] outline-none">

    <label class="font-semibold">Sleep Notes</label>
    <textarea name="sleep_notes" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-[var(--primary)] outline-none"></textarea>

    <label class="font-semibold">Gratitudes</label>
    <textarea name="gratitudes" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-[var(--primary)] outline-none"></textarea>

    <label class="font-semibold">Affirmations</label>
    <textarea name="affirmations" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-[var(--primary)] outline-none"></textarea>

    <label class="font-semibold">Goals</label>
    <textarea name="goals" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-[var(--primary)] outline-none"></textarea>

    <label class="font-semibold">Action Plans</label>
    <textarea name="actions" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-[var(--primary)] outline-none"></textarea>

    <div class="p-4 bg-[var(--bg-light)] rounded-lg text-[var(--secondary)] text-sm font-medium">
      ☀️ Reminder: <span id="morning_reminder"></span>
    </div>

    <label class="font-semibold">Free Thoughts</label>
    <textarea name="morning_freetext" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-[var(--primary)] outline-none"></textarea>
  </div>

  <!-- Night Journal -->
  <div id="night" class="hidden space-y-4">
    <h3 class="text-xl font-semibold text-[var(--primary)]">🌙 Night Reflections</h3>

    <label class="font-semibold">Gratitudes</label>
    <textarea name="night_gratitudes" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-[var(--primary)] outline-none"></textarea>

    <label class="font-semibold">Positives</label>
    <textarea name="positives" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-[var(--primary)] outline-none"></textarea>

    <label class="font-semibold">Goal Progress</label>
    <textarea name="goal_progress" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-[var(--primary)] outline-none"></textarea>

    <div class="p-4 bg-[var(--bg-light)] rounded-lg text-[var(--secondary)] text-sm font-medium">
      🌙 Reminder: <span id="night_reminder"></span>
    </div>

    <label class="font-semibold">Free Thoughts</label>
    <textarea name="night_freetext" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-[var(--primary)] outline-none"></textarea>
  </div>

  <!-- Situational Journal -->
  <div id="situational" class="hidden space-y-4">
    <h3 class="text-xl font-semibold text-[var(--primary)]">🧠 Situational Reflection</h3>

    <label class="font-semibold">Situation</label>
    <textarea name="situation" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-[var(--primary)] outline-none"></textarea>

    <label class="font-semibold">Category</label>
    <select name="situation_category" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-[var(--primary)] outline-none">
      <option>Interpersonal</option>
      <option>Intrapersonal</option>
      <option>Existential</option>
      <option>Societal</option>
      <option>Other</option>
    </select>

    <label class="font-semibold">Feelings</label>
    <textarea name="feelings" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-[var(--primary)] outline-none"></textarea>

    <label class="font-semibold">Used Skills</label>
    <select name="used_skills" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-[var(--primary)] outline-none">
      <option>No</option>
      <option>Yes</option>
    </select>

    <label class="font-semibold">Skills Applied</label>
    <textarea name="skills_used" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-[var(--primary)] outline-none"></textarea>

    <label class="font-semibold">After Effect</label>
    <textarea name="after_effect" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-[var(--primary)] outline-none"></textarea>
  </div>

  <!-- Submit -->
  <button type="submit" class="w-full py-3 rounded-lg text-white font-semibold bg-gradient-to-r from-[var(--primary)] to-[var(--secondary)] hover:opacity-90 transition">
    Save Entry
  </button>
</form>

<div class="text-center mt-6">
  <a href="{{ url_for('home') }}" class="text-[var(--primary)] hover:text-[var(--secondary)] font-medium">← Back to Home</a>
</div>

</main> <script> function showSection() { const journalType = document.getElementById("journal_type").value; const sections = ["free_write", "morning", "night", "situational"]; sections.forEach(id => document.getElementById(id).classList.add("hidden")); if (journalType === "Free Write") document.getElementById("free_write").classList.remove("hidden"); else if (journalType === "Daily Journal - Morning") { document.getElementById("morning").classList.remove("hidden"); showRandomReminder("morning_reminder"); } else if (journalType === "Daily Journal - Night") { document.getElementById("night").classList.remove("hidden"); showRandomReminder("night_reminder"); } else if (journalType === "Situational Journal") document.getElementById("situational").classList.remove("hidden"); } function showRandomReminder(elementId) { const morningReminders = [ "Remember to breathe deeply today 🌤️", "Go outside and feel the sun ☀️", "Drink water and take a walk 💧", "Smile at yourself in the mirror 😊", "You’re capable of great things — take it slow 🌱" ]; const nightReminders = [ "Let go of the day, you did enough 🌙", "Take a deep breath and release your worries 💫", "Stretch and feel your body unwind 💤", "Be kind to yourself — tomorrow is a new day 🌌", "Read or listen to something calming before sleep 🌜" ]; const reminders = elementId.includes("morning") ? morningReminders : nightReminders; const chosen = reminders[Math.floor(Math.random() * reminders.length)]; document.getElementById(elementId).textContent = chosen; } window.onload = showSection; </script> </body> </html>
