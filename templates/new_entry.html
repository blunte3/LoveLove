<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Entry</title>
    <style>
        body { font-family: Arial; margin: 40px; background-color: #fafafa; }
        textarea { width: 100%; height: 300px; font-size: 16px; padding: 10px; }
        select, button { font-size: 16px; margin-top: 10px; padding: 5px 10px; }
        button { background: #007bff; color: white; border: none; border-radius: 6px; }
        button:hover { background: #0056b3; }
        a { text-decoration: none; color: #007bff; }
    </style>
</head>
<body>
    <h1>New Journal Entry</h1>

    <form method="post">
        <label for="journal_type"><b>Journal Type:</b></label>
        <select name="journal_type" id="journal_type">
            <option value="Free Write">Free Write</option>
            <option value="Situational Prompt" disabled>Situational Prompt</option>
            <option value="Morning Prompt" disabled>Morning Prompt</option>
            <option value="Night Prompt" disabled>Night Prompt</option>
        </select>
        <br><br>

        <textarea name="content" placeholder="Write your thoughts here..." required></textarea>
        <br>
        <button type="submit">Save Entry</button>
    </form>

    <br>
    <a href="{{ url_for('home') }}">← Back to Home</a>
</body>
</html>
